<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C(N) 条件概率公式</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* 公式区域 */
        .formula-section {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            padding: 32px;
            text-align: center;
        }

        .formula-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 24px;
            display: inline-block;
        }

        .formula-box .katex {
            font-size: 1.4em;
            color: white;
        }

        /* 含义区域 */
        .meaning-section {
            background: #f8fafc;
            padding: 20px 28px;
            border-bottom: 1px solid #e2e8f0;
        }

        .meaning-title {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .meaning-item {
            font-size: 14px;
            color: #334155;
            padding: 6px 0;
            padding-left: 20px;
            position: relative;
        }

        .meaning-item::before {
            content: '=';
            position: absolute;
            left: 0;
            color: #3b82f6;
            font-weight: 600;
        }

        .meaning-item:first-of-type::before {
            content: '→';
        }

        /* 例子区域 */
        .example-section {
            padding: 28px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background: #f59e0b;
            margin-right: 10px;
            border-radius: 2px;
        }

        /* 树形图 */
        .tree-container {
            background: #f8fafc;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .tree-svg {
            width: 280px;
            height: 160px;
        }

        /* 计算过程 */
        .calc-box {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }

        .calc-label {
            font-size: 12px;
            font-weight: 600;
            color: #b45309;
            margin-bottom: 8px;
        }

        .calc-content {
            font-size: 13px;
            color: #334155;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        /* 结果 */
        .result-row {
            display: flex;
            gap: 12px;
        }

        .result-box {
            flex: 1;
            padding: 14px 16px;
            border-radius: 8px;
            text-align: center;
        }

        .result-box.purple {
            background: #f5f3ff;
            border: 1px solid #c4b5fd;
        }

        .result-box.pink {
            background: #fdf2f8;
            border: 1px solid #f9a8d4;
        }

        .result-formula {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .result-box.purple .result-formula {
            color: #7c3aed;
        }

        .result-box.pink .result-formula {
            color: #db2777;
        }

        .result-desc {
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- 公式 -->
            <div class="formula-section">
                <div class="formula-box">
                    <span class="latex" data-formula="C(N) = \dfrac{\text{COUNT}(N)}{\sum_{M \in \text{CHILDREN}(\text{PARENT}(N))} \text{COUNT}(M)}"></span>
                </div>
            </div>

            <!-- 含义 -->
            <div class="meaning-section">
                <div class="meaning-title">含义</div>
                <div class="meaning-item">在父节点的所有子节点中，N 占的比例</div>
                <div class="meaning-item">"给定已经到达父节点，接下来走到 N 的概率"</div>
                <div class="meaning-item">局部转移概率 / 条件概率</div>
            </div>

            <!-- 例子 -->
            <div class="example-section">
                <div class="section-title">具体例子</div>

                <!-- 树形图 -->
                <div class="tree-container">
                    <svg class="tree-svg" viewBox="0 0 280 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 父节点 x -->
                        <rect x="100" y="10" width="80" height="40" rx="8" fill="#f59e0b"/>
                        <text x="140" y="28" font-size="13" fill="white" text-anchor="middle" font-weight="600" font-family="Monaco, Menlo, monospace">"x"</text>
                        <text x="140" y="42" font-size="9" fill="#fef3c7" text-anchor="middle" font-family="Monaco, Menlo, monospace">COUNT = 3</text>
                        
                        <!-- 标签: 父节点 -->
                        <text x="190" y="30" font-size="10" fill="#64748b" font-family="sans-serif">← 父节点</text>

                        <!-- 连接线 -->
                        <path d="M120 50 L70 85" stroke="#94a3b8" stroke-width="2"/>
                        <path d="M160 50 L210 85" stroke="#94a3b8" stroke-width="2"/>

                        <!-- 子节点 + -->
                        <rect x="30" y="85" width="80" height="40" rx="8" fill="#8b5cf6"/>
                        <text x="70" y="103" font-size="13" fill="white" text-anchor="middle" font-weight="600" font-family="Monaco, Menlo, monospace">"+"</text>
                        <text x="70" y="117" font-size="9" fill="#e9d5ff" text-anchor="middle" font-family="Monaco, Menlo, monospace">COUNT = 2</text>

                        <!-- 子节点 * -->
                        <rect x="170" y="85" width="80" height="40" rx="8" fill="#ec4899"/>
                        <text x="210" y="103" font-size="13" fill="white" text-anchor="middle" font-weight="600" font-family="Monaco, Menlo, monospace">"*"</text>
                        <text x="210" y="117" font-size="9" fill="#fce7f3" text-anchor="middle" font-family="Monaco, Menlo, monospace">COUNT = 1</text>

                        <!-- 标签 -->
                        <text x="70" y="145" font-size="10" fill="#8b5cf6" text-anchor="middle" font-weight="500">N₁</text>
                        <text x="210" y="145" font-size="10" fill="#ec4899" text-anchor="middle" font-weight="500">N₂</text>
                    </svg>
                </div>

                <!-- 计算过程 -->
                <div class="calc-box">
                    <div class="calc-label">计算分母</div>
                    <div class="calc-content">
                        CHILDREN("x") = {"+" , "*"}<br>
                        分母 = COUNT("+") + COUNT("*") = 2 + 1 = 3
                    </div>
                </div>

                <!-- 结果 -->
                <div class="result-row">
                    <div class="result-box purple">
                        <div class="result-formula">C("+") = 2/3 ≈ 0.67</div>
                        <div class="result-desc">在"x"后面，67% 是"+"</div>
                    </div>
                    <div class="result-box pink">
                        <div class="result-formula">C("*") = 1/3 ≈ 0.33</div>
                        <div class="result-desc">在"x"后面，33% 是"*"</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.latex').forEach(el => {
            const formula = el.getAttribute('data-formula');
            katex.render(formula, el, { throwOnError: false, displayMode: true });
        });
    </script>
</body>
</html>
