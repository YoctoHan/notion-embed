<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后缀树遍历可视化 - 修正版</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            
            --primary: #3b82f6;
            --primary-light: #eff6ff;
            --success: #22c55e;
            --success-light: #f0fdf4;
            --orange: #f97316;
            --orange-light: #fff7ed;
            
            --line-color: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .section {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .section:last-child { border-bottom: none; }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            display: block;
            width: 4px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* --- 1. 序列展示 --- */
        .sequence-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .tok {
            padding: 4px 8px;
            background: #e2e8f0;
            color: var(--text-sub);
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .tok.highlight {
            background: var(--orange-light);
            color: #c2410c;
            border: 1px solid var(--orange);
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .legend {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* --- 2. 树形结构 (垂直堆叠布局) --- */
        .tree-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }

        /* 每一层：包含 连接线区域 + 节点区域 */
        .tree-layer {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* 连接线区域 */
        .connector-zone {
            height: 40px;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vertical-line {
            width: 2px;
            height: 100%;
            background-color: var(--line-color);
        }
        .vertical-line.active {
            background-color: var(--primary);
        }

        /* 步骤标签 (浮在连接线旁边) */
        .step-badge {
            position: absolute;
            left: 50%;
            transform: translateX(12px); /* 放在线右侧 */
            background: #fff;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
            font-weight: 600;
            z-index: 2;
        }
        
        /* 节点行 */
        .nodes-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 5;
        }

        .node {
            background: white;
            border: 2px solid var(--line-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-sub);
            min-width: 40px;
            text-align: center;
            transition: all 0.2s;
        }

        .node.root {
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f1f5f9;
            font-weight: bold;
        }

        .node.active {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
            font-weight: bold;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .node.target {
            border-color: var(--success);
            color: #15803d;
            background: var(--success-light);
        }

        .node.ghost {
            border-style: dashed;
            opacity: 0.5;
            font-size: 0.8rem;
            padding: 4px 10px;
        }

        /* 底部结果分支 */
        .branch-zone {
            margin-top: 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            position: relative;
            padding-top: 20px;
        }

        /* 使用伪元素画分支线 */
        .branch-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 10px;
            background: var(--success);
            transform: translateX(-50%);
        }
        
        /* 左右分叉的横线 */
        .branch-connector {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px; /* 两个子节点之间的距离 */
            height: 10px;
            border-top: 2px solid var(--success);
            border-left: 2px solid var(--success);
            border-right: 2px solid var(--success);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .leaf-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            margin-top: 5px;
        }

        .node.leaf {
            border-color: var(--success);
            background: #ffffff;
            font-weight: bold;
            color: #15803d;
        }
        
        .leaf-desc {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* --- 3. 结果列表 --- */
        .result-list {
            background: var(--success-light);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #bbf7d0;
        }
        .result-row {
            display: flex;
            align-items: center;
            font-family: monospace;
            color: #166534;
            margin-bottom: 8px;
        }
        .result-row:last-child { margin-bottom: 0; }
        .dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 12px;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .node.ghost {
                display: none; /* 屏幕太窄时隐藏旁路节点 */
            }
            .step-badge {
                transform: translateX(8px);
                font-size: 0.65rem;
            }
            .branch-connector {
                width: 60px;
            }
            .branch-zone {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">后缀树遍历示例</div>

        <!-- 1. 序列 -->
        <div class="section">
            <div class="section-title">1. 当前序列与模式提取 (p=3)</div>
            <div class="sequence-box">
                <div class="tok">The</div>
                <div class="tok">function</div>
                <div class="tok">def</div>
                <div class="tok">calc</div>
                <div class="tok">(</div>
                <div class="tok">x</div>
                <div class="tok">)</div>
                <div class="tok highlight">:</div>
                <div class="tok highlight">return</div>
                <div class="tok highlight">x</div>
            </div>
            <div class="legend">
                <span style="color: #c2410c; font-weight: bold;">▲ 模式序列</span>: [":", "return", "x"]
            </div>
        </div>

        <!-- 2. 树遍历 -->
        <div class="section">
            <div class="section-title">2. 在后缀树中查找模式</div>
            
            <div class="tree-wrapper">
                
                <!-- Root Node -->
                <div class="nodes-row">
                    <div class="node root">R</div>
                </div>

                <!-- Layer 1: Arrow -> ":" -->
                <div class="tree-layer">
                    <div class="connector-zone">
                        <div class="vertical-line active"></div>
                        <div class="step-badge">第1步: 找 ":"</div>
                    </div>
                    <div class="nodes-row">
                        <div class="node ghost">"def"</div>
                        <div class="node active">":"</div>
                        <div class="node ghost">...</div>
                    </div>
                </div>

                <!-- Layer 2: Arrow -> "return" -->
                <div class="tree-layer">
                    <div class="connector-zone">
                        <div class="vertical-line active"></div>
                        <div class="step-badge">第2步: 找 "return"</div>
                    </div>
                    <div class="nodes-row">
                        <div class="node active">"return"</div>
                    </div>
                </div>

                <!-- Layer 3: Arrow -> "x" -->
                <div class="tree-layer">
                    <div class="connector-zone">
                        <div class="vertical-line active"></div>
                        <div class="step-badge">第3步: 找 "x"</div>
                    </div>
                    <div class="nodes-row">
                        <div class="node active target">"x"</div>
                    </div>
                </div>

                <!-- Final Branching -->
                <div style="margin-top: 8px; font-size: 0.75rem; color: #64748b;">↓ 匹配成功，发现后续分支 ↓</div>
                
                <div class="branch-zone">
                    <div class="branch-connector"></div>
                    
                    <!-- Left Leaf -->
                    <div class="leaf-group">
                        <div class="node leaf">"+"</div>
                        <div class="leaf-desc">("1"...)</div>
                    </div>

                    <!-- Right Leaf -->
                    <div class="leaf-group">
                        <div class="node leaf">"*"</div>
                        <div class="leaf-desc">("2"...)</div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 3. 结果 -->
        <div class="section">
            <div class="section-title">3. 可能的续写路径</div>
            <div class="result-list">
                <div class="result-row">
                    <div class="dot"></div>
                    <div>["+" , "1", ...]</div>
                </div>
                <div class="result-row">
                    <div class="dot"></div>
                    <div>["*" , "2", ...]</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
