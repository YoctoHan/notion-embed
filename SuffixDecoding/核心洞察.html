<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核心洞察 - D值贪婪策略</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            color: #1e293b;
            padding: 40px 20px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 720px;
            width: 100%;
        }

        /* 主卡片 */
        .insight-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        /* 标题区域 */
        .card-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 24px 28px;
            text-align: center;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 2px;
        }

        /* 内容区域 */
        .card-body {
            padding: 28px;
        }

        /* 核心公式区 */
        .core-formula {
            background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .formula-title {
            font-size: 15px;
            color: #3b82f6;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .formula-title::before {
            content: '⚡';
        }

        .formula-main {
            font-size: 16px;
            font-family: 'Monaco', 'Menlo', monospace;
            color: #1e293b;
            font-weight: 700;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: white;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .formula-list {
            list-style: none;
        }

        .formula-list li {
            padding: 8px 0;
            color: #475569;
            font-size: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .formula-list li::before {
            content: '=';
            color: #94a3b8;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* 推导流程 */
        .flow-section {
            margin-bottom: 24px;
        }

        .flow-chain {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .flow-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            color: #1e293b;
            width: 100%;
            text-align: center;
            transition: all 0.3s ease;
        }

        .flow-item:hover {
            border-color: #10b981;
            transform: translateX(4px);
        }

        .flow-item.highlight {
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
            border-color: #10b981;
            color: #059669;
            font-weight: 600;
        }

        .flow-arrow {
            color: #10b981;
            font-size: 18px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px); }
        }

        /* 分隔线 */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
            margin: 24px 0;
        }

        /* 对比区域 */
        .comparison-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }

        .comparison-title {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .comparison-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .comparison-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .comparison-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .comparison-icon.bad {
            background: #fef2f2;
            color: #ef4444;
        }

        .comparison-icon.good {
            background: #ecfdf5;
            color: #10b981;
        }

        .comparison-item.bad .comparison-text {
            color: #64748b;
        }

        .comparison-item.good .comparison-text {
            color: #059669;
            font-weight: 600;
        }

        .comparison-text span {
            color: #94a3b8;
            font-weight: normal;
        }

        /* 示例区域 */
        .examples-section {
            background: linear-gradient(135deg, #faf5ff 0%, #fdf4ff 100%);
            border: 1px solid #e9d5ff;
            border-radius: 8px;
            padding: 16px;
        }

        .examples-title {
            font-size: 12px;
            color: #7c3aed;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .example-item {
            font-size: 13px;
            color: #475569;
            padding: 8px 0;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .example-item::before {
            content: '•';
            color: #7c3aed;
        }

        .example-condition {
            color: #f59e0b;
            font-weight: 600;
        }

        .example-arrow {
            color: #94a3b8;
            margin: 0 4px;
        }

        .example-result {
            color: #10b981;
            font-weight: 600;
        }

        /* 响应式 */
        @media (max-width: 500px) {
            .card-header {
                padding: 20px;
            }

            .card-title {
                font-size: 18px;
                letter-spacing: 1px;
            }

            .card-body {
                padding: 20px;
            }

            .formula-main {
                font-size: 14px;
            }

            .flow-item {
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="insight-card">
            <!-- 标题 -->
            <div class="card-header">
                <div class="card-title">核心洞察</div>
            </div>

            <div class="card-body">
                <!-- 核心公式 -->
                <div class="core-formula">
                    <div class="formula-title">投机解码的收益 = 正确预测的 token 数量</div>
                    
                    <div class="formula-main">D(N) = 从起点到 N 的路径概率</div>
                    
                    <ul class="formula-list">
                        <li>N 被验证接受的估计概率</li>
                        <li>N 对总收益的期望贡献</li>
                    </ul>
                </div>

                <!-- 推导流程 -->
                <div class="flow-section">
                    <div class="flow-chain">
                        <div class="flow-item">贪婪选择 D 最大的节点</div>
                        <div class="flow-arrow">↓</div>
                        <div class="flow-item">优先扩展"最可能被接受"的分支</div>
                        <div class="flow-arrow">↓</div>
                        <div class="flow-item highlight">在有限预算 (MAX_SPEC) 下最大化期望收益</div>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- 策略对比 -->
                <div class="comparison-section">
                    <div class="comparison-title">对比其他策略</div>
                    
                    <div class="comparison-list">
                        <div class="comparison-item bad">
                            <div class="comparison-icon bad">✗</div>
                            <div class="comparison-text">广度优先 <span>— 可能包含很多低概率分支</span></div>
                        </div>
                        <div class="comparison-item bad">
                            <div class="comparison-icon bad">✗</div>
                            <div class="comparison-text">深度优先 <span>— 可能过度投资一条路径</span></div>
                        </div>
                        <div class="comparison-item good">
                            <div class="comparison-icon good">✓</div>
                            <div class="comparison-text">D值贪婪 <span>— 动态平衡深度和广度</span></div>
                        </div>
                    </div>

                    <!-- 示例说明 -->
                    <div class="examples-section">
                        <div class="examples-title">例如：</div>
                        <div class="example-item">
                            <span>如果最高 D 在<span class="example-condition">深层</span><span class="example-arrow">→</span><span class="example-result">继续延伸当前路径</span></span>
                        </div>
                        <div class="example-item">
                            <span>如果最高 D 在<span class="example-condition">浅层新分支</span><span class="example-arrow">→</span><span class="example-result">开始探索新分支</span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
